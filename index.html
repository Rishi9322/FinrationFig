<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicons. Google wants a square image whose size is a multiple of 48px and shows
         it cropped to a circle, so these are padded to stay inside the circle. The big
         home-screen icons live in manifest.webmanifest, not here. -->
    <link rel="icon" href="/favicon.ico?v=4" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=4" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <!-- Installable app (add to home screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#050A14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FinRatio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>FinRatio - Financial Ratio Analysis for Indian SMEs</title>
    <meta name="description" content="FinRatio - financial intelligence for Indian business. Upload a balance sheet and run 12+ ratio calculators, CMA reports and risk assessments." />
    <link rel="canonical" href="https://finratio.site/" />
    <!-- Google Search Console verification: was shipping the literal
         Vite-env placeholder text to prod because the var was never set in
         Vercel - a broken tag is worse than none, so it's removed until
         the env var is set and a real google-site-verification meta tag is
         restored here. -->

    <!-- Open Graph / Twitter Card - static, homepage-oriented. Per-route
         social previews would need per-route og:url too; not worth it until
         individual calculator pages are actually shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FinRatio" />
    <meta property="og:title" content="FinRatio - Financial Ratio Analysis for Indian SMEs" />
    <meta property="og:description" content="Upload a balance sheet and run 12+ ratio calculators, CMA reports and risk assessments." />
    <meta property="og:url" content="https://finratio.site/" />
    <meta property="og:image" content="https://finratio.site/logoo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FinRatio - Financial Ratio Analysis for Indian SMEs" />
    <meta name="twitter:description" content="Upload a balance sheet and run 12+ ratio calculators, CMA reports and risk assessments." />
    <meta name="twitter:image" content="https://finratio.site/logoo.png" />

    <!-- JSON-LD: what FinRatio is, in a form both search and AI answer
         engines can quote directly instead of inferring from rendered JS. -->
    <!-- Brand identity for search: tells Google the site's name and logo. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://finratio.site/#org",
            "name": "FinRatio",
            "url": "https://finratio.site/",
            "logo": { "@type": "ImageObject", "url": "https://finratio.site/icon-512.png", "width": 512, "height": 512 },
            "parentOrganization": { "@type": "Organization", "name": "Balaji Credit Services Pvt. Ltd.", "url": "https://balajicredits.com" }
          },
          {
            "@type": "WebSite",
            "@id": "https://finratio.site/#website",
            "url": "https://finratio.site/",
            "name": "FinRatio",
            "alternateName": "FinRatio - Financial Ratio Analysis",
            "inLanguage": "en-IN",
            "publisher": { "@id": "https://finratio.site/#org" }
          }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "FinRatio",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "description": "Financial ratio analysis platform for Indian SMEs and credit teams - 12+ ratio calculators (Debt-to-Equity, DSCR, ISCR, EBITDA, Current Ratio, and more), CMA report generation, and AI-assisted credit analysis.",
        "url": "https://finratio.site/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
      }
    </script>

    <!-- Analytics (GA4 + Microsoft Clarity). Init lives in /ga.js so no
         'unsafe-inline' is needed in the CSP, and so nothing loads until the
         ids are set and the visitor accepts cookies. -->
    <script src="/ga.js" data-ga-id="%VITE_GA_ID%" data-clarity-id="%VITE_CLARITY_ID%"></script>
  </head>
  <body>
    <!-- Set the theme class before first paint so there's no flash of the
         wrong theme while React hydrates. Keep this logic in sync with
         src/lib/theme.tsx's getInitialTheme(). It is an external file, not inline,
         because the CSP forbids inline scripts. -->
    <script src="/theme-init.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
