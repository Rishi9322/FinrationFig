<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050A14" />
    <title>Offline - FinRatio</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center; text-align: center;
        background: #050a14; color: #e2e8f0; padding: 24px; box-sizing: border-box;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 20px; }
      h1 { font-size: 22px; margin: 0 0 8px; font-weight: 600; }
      p { margin: 0 0 24px; color: #94a3b8; max-width: 32ch; }
      a {
        display: inline-block; padding: 12px 22px; border-radius: 10px;
        background: #2563eb; color: #fff; text-decoration: none; font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>FinRatio needs an internet connection to load your data. Check your connection and try again.</p>
      <a href="/dashboard">Try again</a>
    </main>
  </body>
</html>
