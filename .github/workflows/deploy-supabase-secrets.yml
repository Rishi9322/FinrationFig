name: Deploy Supabase Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-secrets:
    name: Deploy Supabase Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node + supabase CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          npm install -g supabase

      - name: Push secrets to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; fi
          if [ -z "${SUPABASE_PROJECT_REF}" ]; then echo "Missing SUPABASE_PROJECT_REF secret"; exit 1; fi
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then echo "Missing JWT_SECRET secret"; exit 1; fi
          supabase secrets set \
            ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
            ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
            ADMIN_NAME="${{ secrets.ADMIN_NAME }}" \
            ADMIN_PHONE_NUMBER="${{ secrets.ADMIN_PHONE_NUMBER }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            OPENROUTER_MODEL_NAME="${{ vars.OPENROUTER_MODEL_NAME }}" \
            RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            RESEND_FROM_EMAIL="${{ vars.RESEND_FROM_EMAIL }}" \
            APP_ORIGIN="${{ vars.APP_ORIGIN }}" \
            APP_BASE_URL="${{ vars.APP_BASE_URL }}" \
            --project "$SUPABASE_PROJECT_REF"
