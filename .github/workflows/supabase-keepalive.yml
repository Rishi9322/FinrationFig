name: Supabase keep-alive

# Free-tier projects pause after ~7 days of inactivity; hit the API every 3 days.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -o /dev/null \
            "https://mtetzgeewpnwkiimjebg.supabase.co/rest/v1/"
